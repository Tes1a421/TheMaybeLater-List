name: Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate scripts
        run: |
          node --check main.js
          node --check preload.js
          node --check renderer.js

      - name: Build installer and portable ZIP
        run: npm run build:win

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-FileHash release/*.exe, release/*.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" } |
            Set-Content release/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaoyang-gedan-windows-x64
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ github.ref_name }}" `
              --title "小羊鸽单 ${{ github.ref_name }}" `
              --generate-notes
          }
          gh release upload "${{ github.ref_name }}" `
            release/*.exe `
            release/*.zip `
            release/SHA256SUMS.txt `
            --clobber
